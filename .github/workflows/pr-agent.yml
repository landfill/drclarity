name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# 연속 푸시 시 진행 중이던 리뷰를 취소하고 최신 커밋 기준으로만 한 번 돌린다.
concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' || github.event.issue.pull_request)
    name: Review pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    steps:
      - name: Run PR Agent
        id: pr-agent
        # PR-Agent v0.42.0
        uses: docker://pragent/pr-agent@sha256:b81235c3bddc551939a1feca8926f4b6e8abcec2ae5bf4620424f8f56dd9cb93
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          config.model: "gpt-5.6-luna"
          config.fallback_models: '["gpt-5.6-luna"]'
          config.reasoning_effort: "medium"
          config.response_language: "ko-KR"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'

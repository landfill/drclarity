name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# CI와 별도 취소 풀. 같은 PR의 "같은 이벤트 종류" 이전 실행만 취소한다.
# 이벤트 종류(event_name)를 그룹 키에 포함하는 이유: 봇 댓글(issue_comment) run 은 job 레벨
# Bot 가드로 skip 되지만, 워크플로 레벨 concurrency 취소는 그 판정보다 먼저 일어난다 —
# 그룹을 공유하면 봇 댓글이 진행 중인 pull_request 리뷰 run 을 취소해 버린다(실측: PR #23·#25·#26).
# 분리하면 push(synchronize)끼리의 이전 리뷰 취소는 유지되고, 교차 취소만 사라진다.
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-agent:
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' || github.event.issue.pull_request)
    name: Review pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    steps:
      - name: Run PR Agent
        id: pr-agent
        # PR-Agent v0.42.0
        uses: docker://pragent/pr-agent@sha256:b81235c3bddc551939a1feca8926f4b6e8abcec2ae5bf4620424f8f56dd9cb93
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 주 모델: Google Gemini(Google AI Studio). 모델명은 "gemini/" 접두 필수(provider prefix).
          # PR-Agent 공식 env 형식(점 구분) — Dynaconf 가 GOOGLE_AI_STUDIO.GEMINI_API_KEY 로 매핑한다.
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 폴백: OpenAI. 주 모델과 다른 제공자·다른 계정이어야 폴백이 실제로 동작한다(#27).
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          # 3.7-flash 가 아니라 3.6-flash 인 이유: PR-Agent 는 요청 전에 자기 MAX_TOKENS
          # 표에서 모델을 찾고, 없으면 그 자리에서 포기한다. 3.7 은 업스트림 #2657 로
          # 등록됐지만 그 커밋(2026-08-15)이 v0.42.0 릴리스(2026-08-08)보다 늦어서
          # 이 이미지의 표에는 없다. 3.6 은 #2538 로 릴리스 전에 들어가 있다.
          # 3.7 을 쓰려면 config.custom_model_max_tokens 로 표 조회를 건너뛰어야 하는데,
          # 그 설정은 모델별이 아니라 전역이라 폴백 모델에도 같은 값이 걸린다.
          config.model: "gemini/gemini-3.6-flash"
          config.fallback_models: '["gpt-5.6-luna"]'
          config.reasoning_effort: "medium"
          config.response_language: "ko-KR"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
